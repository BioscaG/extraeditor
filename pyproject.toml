[project]
name = "montaje"
version = "0.1.0"
description = "Agentic, general-purpose video editor: footage in, professional edit out."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "opentimelineio>=0.17",
]

[project.optional-dependencies]
analysis = [
    "librosa>=0.10",
    "soundfile>=0.12",
]

[project.scripts]
montaje = "montaje.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/montaje"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# typer's entire API is function calls in argument defaults (typer.Option/Argument).
"src/montaje/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
